<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>IPC Demo</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        padding: 16px;
      }
      h1 {
        font-size: 18px;
        font-weight: 700;
        margin: 0 0 4px;
        color: #0f172a;
      }
      .subtitle {
        font-size: 11px;
        color: #64748b;
        margin: 0 0 16px;
      }
      .status-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        margin-bottom: 14px;
        padding: 6px 10px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #94a3b8;
        flex-shrink: 0;
      }
      .dot.connecting { background: #f59e0b; }
      .dot.ready      { background: #22c55e; }
      .dot.error      { background: #ef4444; }
      .dot.closed     { background: #94a3b8; }
      .counter {
        margin-left: auto;
        font-size: 11px;
        color: #475569;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      button {
        padding: 7px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #334155;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.1s;
      }
      button:hover:not(:disabled) { background: #f1f5f9; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-ping  { border-color: #6366f1; color: #4f46e5; }
      .btn-ping:hover:not(:disabled)  { background: #eef2ff; }
      .btn-time  { border-color: #0ea5e9; color: #0284c7; }
      .btn-time:hover:not(:disabled)  { background: #f0f9ff; }
      .btn-echo  { border-color: #10b981; color: #059669; }
      .btn-echo:hover:not(:disabled)  { background: #ecfdf5; }
      .btn-title { border-color: #f59e0b; color: #d97706; }
      .btn-title:hover:not(:disabled) { background: #fffbeb; }
      .result-area {
        min-height: 80px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        overflow-y: auto;
        max-height: 160px;
      }
      .result-area p { margin: 0 0 4px; }
      .result-entry {
        padding: 3px 6px;
        border-radius: 4px;
        margin-bottom: 3px;
        word-break: break-all;
      }
      .result-ok    { background: #f0fdf4; color: #166534; }
      .result-err   { background: #fef2f2; color: #991b1b; }
      .result-info  { background: #f8fafc; color: #475569; }
      .divider {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 14px 0;
      }
      .hint { font-size: 11px; color: #64748b; }
    </style>
  </head>
  <body>
    <h1>IPC Demo</h1>
    <p class="subtitle">window.__zmosIpc 를 통한 호스트 RPC 데모</p>

    <!-- 연결 상태 바 -->
    <div class="status-bar">
      <span class="dot" id="dot"></span>
      <span id="status-label">초기화 중...</span>
      <span class="counter">호스트 RPC 횟수: <strong id="rpc-count">0</strong></span>
    </div>

    <!-- RPC 버튼 -->
    <div class="btn-row">
      <button class="btn-ping" id="btn-ping" disabled>demo.ping</button>
      <button class="btn-time" id="btn-time" disabled>demo.getTime</button>
      <button class="btn-echo" id="btn-echo" disabled>demo.echo("hello from app")</button>
      <button class="btn-title" id="btn-title" disabled>shell.setTitle</button>
    </div>

    <!-- 응답 영역 -->
    <div class="result-area" id="result-area">
      <div class="result-entry result-info">호스트 연결 대기 중...</div>
    </div>

    <hr class="divider" />

    <p class="hint">
      이 앱은 <code>window.__zmosIpc.call(method, args)</code>로 호스트에 RPC를 전송합니다.<br />
      호스트가 노출한 메서드: <code>ping</code> · <code>getTime</code> · <code>echo</code>
    </p>

    <script src="/sample-game-ipc/app.js"></script>
  </body>
</html>
