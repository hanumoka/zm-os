<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Bouncing Ball</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #fafafa; color: #222; }
      canvas { display: block; background: #fff; }
      #status { padding: 8px 12px; font-size: 12px; border-top: 1px solid #eee; }
      #status .ok { color: #16a34a; }
      #status .fail { color: #dc2626; }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="280"></canvas>
    <div id="status"></div>
    <script src="/sample-game/app.js"></script>
  </body>
</html>
