<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Spinning Cubes</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
      }
      #hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 6px 12px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        font-size: 12px;
        flex-shrink: 0;
      }
      #hud .engine { color: #a78bfa; font-weight: 600; }
      #hud .info { color: #94a3b8; }
      #hud .status { color: #4ade80; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="hud">
      <span class="engine">Three.js Spinning Cubes</span>
      <span class="info" id="fpsCounter">FPS: --</span>
      <span class="status" id="isolation">checking...</span>
    </div>

    <script src="/three.min.js"></script>
    <script src="/sample-game-three/app.js"></script>
  </body>
</html>
