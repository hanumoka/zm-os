<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Snake</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
      }
      #hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 600px;
        padding: 8px 12px;
        background: #1e293b;
        border-bottom: 1px solid #334155;
        font-size: 13px;
        gap: 12px;
        flex-shrink: 0;
      }
      #hud .score-label { color: #94a3b8; }
      #hud .score-value {
        font-size: 18px;
        font-weight: 700;
        color: #4ade80;
        min-width: 40px;
        text-align: right;
      }
      #hud .hint {
        font-size: 11px;
        color: #64748b;
        text-align: center;
        flex: 1;
      }
      #game-container canvas {
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.85);
        gap: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #overlay.visible { opacity: 1; pointer-events: auto; }
      #overlay .over-title {
        font-size: 32px;
        font-weight: 800;
        color: #f87171;
        letter-spacing: -0.5px;
      }
      #overlay .over-score {
        font-size: 16px;
        color: #94a3b8;
      }
      #overlay .over-hint {
        font-size: 13px;
        color: #22d3ee;
        margin-top: 8px;
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <span class="score-label">점수</span>
      <span class="score-value" id="score-display">0</span>
      <span class="hint" id="hud-hint">화살표 키로 조종</span>
    </div>
    <div id="game-container"></div>

    <!-- Game Over 오버레이 -->
    <div id="overlay">
      <div class="over-title">Game Over</div>
      <div class="over-score" id="over-score">점수: 0</div>
      <div class="over-hint">Space 키로 재시작</div>
    </div>

    <!-- Phaser 3 — host self origin 상대경로 (sandbox srcdoc null-origin → host /phaser.min.js 로드) -->
    <script src="/phaser.min.js"></script>

    <script src="/sample-game-phaser/app.js"></script>
  </body>
</html>
